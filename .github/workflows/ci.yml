name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - name: PHP syntax
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: CSV helper tests
        run: php tests/csv_test.php

  e2e:
    runs-on: ubuntu-latest
    env:
      # Production mode with an admin password, as on Cloud Run.
      APP_ENV: production
      ADMIN_PASSWORD: ci-secret
      POSTGRES_PASSWORD: ci-db-password
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: End-to-end checks
        run: |
          set -euo pipefail
          B=http://127.0.0.1:8080
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          sql() { docker compose exec -T db psql -U user -d appdb -tAc "$1"; }

          curl -fsS $B/healthz
          curl -fsS $B/ | grep -q 'connected'
          curl -fsSI $B/ | grep -qi '^content-security-policy:'

          echo "Admin pages need the password"
          test "$(code $B/csv-import.php)" = 401
          test "$(code -u admin:wrong $B/view-tables.php)" = 401

          echo "Import needs a CSRF token"
          curl -fsS -c jar -u admin:ci-secret $B/csv-import.php > page.html
          token=$(grep -o 'name="csrf" value="[a-f0-9]*"' page.html | head -1 | sed 's/.*value="//; s/"$//')
          test -n "$token"
          test "$(code -b jar -u admin:ci-secret -F table_name=sample -F csv_file=@tests/fixtures/sample.csv $B/csv-import.php)" = 403

          echo "Import"
          curl -fsS -b jar -u admin:ci-secret -F csrf=$token -F table_name=sample \
            -F csv_file=@tests/fixtures/sample.csv $B/csv-import.php | grep -q 'Inserted 3 rows'
          test "$(sql "select zip from sample where name = 'Alice'")" = 02134
          test "$(sql "select price from sample where name = 'Alice'")" = 0.12345
          test "$(sql 'select count(*) from sample')" = 3

          echo "Browse and delete a row"
          curl -fsS -b jar -u admin:ci-secret "$B/view-tables.php?table=sample" | grep -q 'Carol'
          id=$(sql "select id from sample where name = 'Bob'")
          curl -fsS -b jar -u admin:ci-secret -F csrf=$token -F action=delete_row -F table_name=sample \
            -F row_id=$id "$B/view-tables.php?table=sample" | grep -q 'Row deleted'
          test "$(sql 'select count(*) from sample')" = 2

          echo "Internal files are never served"
          for p in /lib/db.php /lib/security.php /db.php /healthz.php /.env /Dockerfile /tests/csv_test.php; do
            c=$(code "$B$p"); echo "$p -> $c"; test "$c" = 404
          done
      - name: Logs
        if: always()
        run: docker compose logs
