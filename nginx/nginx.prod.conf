server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php index.html;

    server_tokens off;
    client_max_body_size 100m;

    location ~ /\. {
        deny all;
    }

    # Helpers included by the pages; never served directly.
    location ^~ /includes/ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Large CSV imports insert row by row and can take minutes.
        fastcgi_read_timeout 300s;
    }
}
