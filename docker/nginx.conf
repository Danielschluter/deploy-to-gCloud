# Rendered by docker/entrypoint.sh: ${PORT} is replaced at container start.
server {
    listen ${PORT} default_server;
    server_name _;
    root /app/src;
    index index.php;

    server_tokens off;
    # CSV uploads; keep in step with upload_max_filesize in docker/php.ini.
    client_max_body_size 21m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/plain;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location = /healthz {
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/healthz.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass 127.0.0.1:9000;
    }

    # Only these pages run; lib/ and any other PHP file is never executed or served.
    location ~ ^/(index|csv-import|view-tables)\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 130s;
    }

    location ~ \.php$ {
        return 404;
    }

    location ^~ /lib/ {
        return 404;
    }

    location ~ /\. {
        return 404;
    }

    # Internal rewrite, so the request goes through the PHP location above.
    location = / {
        rewrite ^ /index.php last;
    }

    location / {
        return 404;
    }
}
