; Loaded after the image's www.conf and zz-docker.conf, so these settings win.
[www]
listen = 127.0.0.1:9000

; Pass the container's environment (DB_*, ADMIN_*) to PHP.
clear_env = no

pm = ondemand
pm.max_children = ${FPM_MAX_CHILDREN}
pm.process_idle_timeout = 60s
pm.max_requests = 500
request_terminate_timeout = 130s

; nginx already logs each request.
access.log = /dev/null
