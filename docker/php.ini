; Overrides on top of php.ini-production.
expose_php = Off
display_errors = Off
log_errors = On
date.timezone = UTC

memory_limit = 256M
max_execution_time = 120

; CSV uploads. Keep nginx's client_max_body_size in step.
upload_max_filesize = 20M
post_max_size = 21M

opcache.enable = 1
opcache.memory_consumption = 64
; 0 in the image (code never changes); docker-compose sets 1 for live editing.
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
